<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Sombra de la caja -->
  <ellipse cx="100" cy="170" rx="50" ry="8" fill="#e0e0e0" opacity="0.5"/>
  
  <!-- Parte inferior de la caja -->
  <path d="M 50 100 L 50 150 L 100 170 L 150 150 L 150 100 Z" 
        fill="#f5f5f5" 
        stroke="#9e9e9e" 
        stroke-width="2"/>
  
  <!-- Lado izquierdo de la caja -->
  <path d="M 50 100 L 100 120 L 100 170 L 50 150 Z" 
        fill="#e8e8e8" 
        stroke="#9e9e9e" 
        stroke-width="2"/>
  
  <!-- Lado derecho de la caja -->
  <path d="M 150 100 L 100 120 L 100 170 L 150 150 Z" 
        fill="#dedede" 
        stroke="#9e9e9e" 
        stroke-width="2"/>
  
  <!-- Tapa de la caja (abierta) -->
  <g>
    <!-- Solapa izquierda -->
    <path d="M 30 80 L 50 100 L 100 120 L 80 95 Z" 
          fill="#fafafa" 
          stroke="#9e9e9e" 
          stroke-width="2"/>
    
    <!-- Solapa derecha -->
    <path d="M 170 80 L 150 100 L 100 120 L 120 95 Z" 
          fill="#eeeeee" 
          stroke="#9e9e9e" 
          stroke-width="2"/>
    
    <!-- Solapa trasera -->
    <path d="M 80 95 L 100 120 L 120 95 L 100 85 Z" 
          fill="#e0e0e0" 
          stroke="#9e9e9e" 
          stroke-width="2"/>
  </g>
  
  <!-- Líneas de detalle en la caja -->
  <line x1="50" y1="100" x2="100" y2="120" stroke="#b0b0b0" stroke-width="1" opacity="0.5"/>
  <line x1="150" y1="100" x2="100" y2="120" stroke="#b0b0b0" stroke-width="1" opacity="0.5"/>
</svg>